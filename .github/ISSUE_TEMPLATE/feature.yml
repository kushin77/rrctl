name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: ["enhancement"]

body:
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: Describe the feature you'd like to see
      placeholder: |
        It would be great if rrctl could...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation & Use Case
      description: Why is this feature important? What problem does it solve?
      placeholder: |
        This would be useful for:
        - [use case 1]
        - [use case 2]
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: How should this feature work?
      placeholder: |
        ```bash
        rrctl new-command --option value
        ```

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Are there other ways to solve this?

  - type: input
    id: priority
    attributes:
      label: Priority
      description: How urgent is this feature?
      options:
        - Low (nice to have)
        - Medium (useful)
        - High (important)

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: "I have searched for similar feature requests"
          required: true
        - label: "This feature aligns with rrctl's goals"
          required: false
